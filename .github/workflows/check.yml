name: check

# Every pull request: the review-sheet answers and corrections it changes must be readable and well formed.
# A sheet may differ from its base only in its answer cells: headings (the links' anchors), tables, streets, order and prose must be unchanged.
# An answer must name someone, a correction needs a reason. (Regeneration pull requests are opened by github-actions[bot], change generated
# rows on purpose and are skipped; the author, not the branch name, decides, so nobody can claim the exemption.) The checks live in the code
# repository (src/ingest_answers.py).

on:
  pull_request:

# Read-only token: the job only checks out code and runs checks.
permissions:
  contents: read

jobs:
  answers:
    if: ${{ github.event.pull_request.user.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: knowledge
      - uses: actions/checkout@v4
        with:
          repository: straatwijsheid/straatwijsheid
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check the changed sheets and corrections
        env:
          STREETS_KNOWLEDGE_DIR: ${{ github.workspace }}/knowledge
        run: python core/src/ingest_answers.py --validate-changed "origin/${{ github.base_ref }}"
