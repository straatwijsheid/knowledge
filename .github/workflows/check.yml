name: check

# Every pull request: the review-sheet answers and corrections it changes must be readable and well formed.
# Only the answer column of a sheet may change, an answer must name someone, a correction needs a reason. (Sheet regeneration pull requests,
# branch regenerate-sheets/..., change generated rows on purpose and are skipped.) The checks live in the code repository (src/ingest_answers.py).

on:
  pull_request:

jobs:
  answers:
    if: ${{ !startsWith(github.head_ref, 'regenerate-sheets/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: knowledge
      - uses: actions/checkout@v4
        with:
          repository: straatwijsheid/straatwijsheid
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check the changed sheets and corrections
        env:
          STREETS_KNOWLEDGE_DIR: ${{ github.workspace }}/knowledge
        run: python core/src/ingest_answers.py --validate-changed "origin/${{ github.base_ref }}"
