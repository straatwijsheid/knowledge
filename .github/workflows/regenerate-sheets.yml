name: regenerate sheets

# Re-renders every gemeente's REVIEW.md from the street data of a published build and opens a pull request if anything changed. Answers already in the
# sheets are kept (src/review_sheet.py). No network lookups and no build: the sheets are made from `review-inputs.json.gz`, a release asset of the code
# repository that is exported when a map is published (docs/publishing.md there). Run it after a new release.
# Needs: Settings, Actions, General, "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release of straatwijsheid/straatwijsheid with review-inputs.json.gz (empty: the latest)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: knowledge
      - uses: actions/checkout@v4
        with:
          repository: straatwijsheid/straatwijsheid
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Download the build's sheet inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download ${TAG:+"$TAG"} --repo straatwijsheid/straatwijsheid --pattern review-inputs.json.gz --dir "$RUNNER_TEMP"
      - name: Regenerate the sheets
        env:
          STREETS_KNOWLEDGE_DIR: ${{ github.workspace }}/knowledge
        run: python core/src/review_sheet.py --all --inputs "$RUNNER_TEMP/review-inputs.json.gz"
      - name: Open a pull request if anything changed
        working-directory: knowledge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if git diff --quiet; then echo "The sheets are already current."; exit 0; fi
          branch="regenerate-sheets/$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qam "Regenerate review sheets${TAG:+ from $TAG}"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "Regenerate review sheets${TAG:+ from $TAG}" \
            --body "Generated by the regenerate-sheets workflow from the build's sheet inputs. Answers already in the sheets are kept; answers for streets that now have a correction are dropped; answers for streets no longer asked about move to the last section of their sheet."
